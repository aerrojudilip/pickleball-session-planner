<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7d4f" />
    <meta name="description" content="Plan pickleball open play: rosters, fair round rotations, scores, stats, and a court booking calendar. Works offline, installs to your phone." />
    <title>Pickleball Session Planner</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <div class="app" id="app">
      <header class="app__header">
        <div class="app__brand">
          <span class="app__logo" aria-hidden="true"></span>
          <span class="app__title">Pickleball Planner</span>
        </div>
        <div class="app__header-actions">
          <button class="iconbtn" id="undoBtn" type="button" title="Undo" aria-label="Undo" disabled>
            <span aria-hidden="true">&#8630;</span>
          </button>
          <button class="iconbtn" id="redoBtn" type="button" title="Redo" aria-label="Redo" disabled>
            <span aria-hidden="true">&#8631;</span>
          </button>
          <button class="iconbtn" id="displayBtn" type="button" title="Display mode" aria-label="Display mode">
            <span aria-hidden="true">&#9974;</span>
          </button>
        </div>
      </header>

      <main class="app__main" id="main" tabindex="-1"></main>

      <nav class="app__nav" id="nav" aria-label="Primary">
        <button class="navbtn" data-route="roster" type="button">
          <span class="navbtn__icon" aria-hidden="true">&#128101;</span>
          <span class="navbtn__label">Roster</span>
        </button>
        <button class="navbtn" data-route="schedule" type="button">
          <span class="navbtn__icon" aria-hidden="true">&#128197;</span>
          <span class="navbtn__label">Schedule</span>
        </button>
        <button class="navbtn" data-route="session" type="button">
          <span class="navbtn__icon" aria-hidden="true">&#127934;</span>
          <span class="navbtn__label">Play</span>
        </button>
        <button class="navbtn" data-route="stats" type="button">
          <span class="navbtn__icon" aria-hidden="true">&#128202;</span>
          <span class="navbtn__label">Stats</span>
        </button>
        <button class="navbtn" data-route="more" type="button">
          <span class="navbtn__icon" aria-hidden="true">&#9776;</span>
          <span class="navbtn__label">More</span>
        </button>
      </nav>
    </div>

    <div class="toast-root" id="toastRoot" aria-live="polite" aria-atomic="false"></div>
    <div class="dialog-root" id="dialogRoot"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
